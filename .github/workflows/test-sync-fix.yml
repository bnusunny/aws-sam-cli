name: Test Sync Watch Fix

on:
  push:
    branches: [fix/sync-watch-tests]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  SAM_CLI_DEV: 1
  SAM_CLI_TELEMETRY: 0
  SAM_CLI_CONTAINER_CONNECTION_TIMEOUT: 60
  BY_CANARY: true
  NOSE_PARAMETERIZED_NO_WARN: 1

jobs:
  sync-integ-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          nohup sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
          nohup docker system prune -af --volumes > /dev/null 2>&1 &

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.9

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Install Maven
        run: |
          sudo apt-get remove -y maven || true
          wget -q https://dlcdn.apache.org/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.zip -P /tmp
          sudo unzip -q -d /opt/mvn /tmp/apache-maven-*.zip
          sudo ln -sf /opt/mvn/apache-maven-3.9.12/bin/mvn /usr/local/bin/mvn
          echo "/opt/mvn/apache-maven-3.9.12/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=/opt/mvn/apache-maven-3.9.12" >> $GITHUB_ENV

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'

      - name: Setup QEMU for ARM64 emulation
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Initialize project
        run: make init

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Run failing sync tests
        run: |
          pytest -vv --reruns 3 --dist loadscope \
            -k "TestSyncAdlWithWatchStartWithNoDependencies or TestSyncWatchInfraWithInvalidTemplate or TestSyncInfraNestedStacks" \
            tests/integration/sync/test_sync_adl.py \
            tests/integration/sync/test_sync_watch.py \
            --json-report --json-report-file=test-report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sync-test-report
          path: test-report.json
