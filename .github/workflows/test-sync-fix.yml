name: Test Sync Fix - Cache Removal

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  SAM_CLI_DEV: 1
  SAM_CLI_TELEMETRY: 0
  SAM_CLI_CONTAINER_CONNECTION_TIMEOUT: 60
  NOSE_PARAMETERIZED_NO_WARN: 1
  BY_CANARY: true
  UV_PYTHON: python3.11

jobs:
  sync-tests:
    name: Sync Integration Tests (docker)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af --volumes || true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.9
            3.10
            3.12
            3.13
            3.14

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Install Maven and Gradle
        run: |
          sudo apt-get remove -y maven || true
          wget https://dlcdn.apache.org/maven/maven-3/3.9.12/binaries/apache-maven-3.9.12-bin.zip -P /tmp
          sudo unzip -d /opt/mvn /tmp/apache-maven-*.zip
          wget https://services.gradle.org/distributions/gradle-9.2.0-bin.zip -P /tmp
          sudo unzip -d /opt/gradle /tmp/gradle-*.zip
          sudo ln -sf /opt/mvn/apache-maven-3.9.12/bin/mvn /usr/local/bin/mvn
          sudo ln -sf /opt/gradle/gradle-9.2.0/bin/gradle /usr/local/bin/gradle
          echo "/opt/mvn/apache-maven-3.9.12/bin" >> $GITHUB_PATH
          echo "/opt/gradle/gradle-9.2.0/bin" >> $GITHUB_PATH
          echo "MAVEN_HOME=/opt/mvn/apache-maven-3.9.12" >> $GITHUB_ENV

      - name: Set up Ruby 3.4.7
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'

      - name: Setup QEMU for ARM64 emulation
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Initialize project
        run: make init

      - name: Set up test resources
        run: |
          # Create S3 bucket and ECR repo for tests using OIDC credentials
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="sam-cli-sync-test-${ACCOUNT_ID}-${GITHUB_RUN_ID}"
          ECR_REPO_URI="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/sam-cli-sync-test-${GITHUB_RUN_ID}"

          aws s3 mb "s3://${BUCKET_NAME}" || true
          aws ecr create-repository --repository-name "sam-cli-sync-test-${GITHUB_RUN_ID}" || true

          echo "AWS_S3_TESTING=${BUCKET_NAME}" >> $GITHUB_ENV
          echo "AWS_ECR_TESTING=${ECR_REPO_URI}" >> $GITHUB_ENV

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Login to Private ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.us-east-1.amazonaws.com

      - name: Run sync watch nested stack tests
        run: |
          pytest -vv tests/integration/sync/test_sync_watch.py -k "TestSyncInfraNestedStacks" --reruns 1 --json-report --json-report-file=TEST_REPORT-sync-nested.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-sync-fix
          path: TEST_REPORT-*.json

      - name: Cleanup test resources
        if: always()
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws s3 rb "s3://sam-cli-sync-test-${ACCOUNT_ID}-${GITHUB_RUN_ID}" --force || true
          aws ecr delete-repository --repository-name "sam-cli-sync-test-${GITHUB_RUN_ID}" --force || true
          # Clean up any CloudFormation stacks created by the tests
          for stack in $(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --query "StackSummaries[?starts_with(StackName, 'test-sync-watch-infra-nested')].StackName" --output text); do
            aws cloudformation delete-stack --stack-name "$stack" || true
          done
